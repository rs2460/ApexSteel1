{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h1 class="auth-title">Check Your Email</h1>
        <p class="auth-subtitle">Use the link below to reset your password.</p>
        <div class="auth-links">
            <a href="{% url 'login' %}" class="auth-button" style="text-decoration: none; display: block;">Back to Login</a>
        </div>
    </div>
</div>
{% endblock %}
