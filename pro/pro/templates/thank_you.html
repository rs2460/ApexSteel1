{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <style>
        .thank-you-section {
            padding: 150px 50px 100px;
            text-align: center;
            background-color: #f8f8f8;
            min-height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .thank-you-card {
            background: #fff;
            padding: 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            animation: fadeInUp 0.8s ease-out;
        }

        .success-icon {
            font-size: 80px;
            color: #2ecc71;
            margin-bottom: 30px;
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both;
        }

        .thank-you-card h1 {
            font-family: var(--serif-font);
            font-size: 48px;
            margin-bottom: 20px;
            color: #000;
        }

        .thank-you-card p {
            font-size: 18px;
            color: var(--gray-text);
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .btn-continue-shopping {
            display: inline-block;
            padding: 15px 40px;
            background-color: #000;
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            transition: all 0.3s ease;
        }

        .btn-continue-shopping:hover {
            background-color: #333;
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }
    </style>
{% endblock %}

{% block content %}
<section class="thank-you-section">
    <div class="thank-you-card">
        <div class="success-icon">
            <i class="fas fa-check-circle"></i>
        </div>
        <h1>Thank You!</h1>
        <p>Your order has been placed successfully. We've sent a confirmation email to your registered address.</p>
        <a href="{% url 'product_list' %}" class="btn-continue-shopping">Continue Shopping</a>
    </div>
</section>
{% endblock %}
